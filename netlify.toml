[build]
  publish = "."

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    # نطاق العامل: بلا هذا لا يستطيع عامل في الجذر التحكّم بغيره — وهو
    # هنا في الجذر أصلاً، لكن التصريح يمنع أي التباس عند تغيّر النشر.
    Service-Worker-Allowed = "/"

# نوع محتوى بيان التطبيق.
# Netlify يقدّم ملفات .json كـ application/json، والمواصفة تحدّد
# application/manifest+json. متصفّح Chrome يتساهل، وبعض إصدارات
# Samsung Internet لا تتساهل: ترفض البيان فيسقط شرط التثبيت، فيظهر
# «إضافة إلى الشاشة الرئيسية» كاختصار عاديّ — أو يُرفض التثبيت.
# التصريح هنا هو الشكل الصحيح بالمواصفة، ولا يضرّ المتصفّحات المتساهلة.
[[headers]]
  for = "/manifest.json"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"
    Cache-Control = "no-cache"

# الأيقونات: نوعها الصريح يمنع أي تخمين من الخادم أو المتصفّح
[[headers]]
  for = "/*.png"
  [headers.values]
    Content-Type = "image/png"
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/icon.svg"
  [headers.values]
    Content-Type = "image/svg+xml"
    Cache-Control = "public, max-age=604800"

# app.js و app.css يحملان ?v=BUILD في العنوان، فالمتصفح يجلب نسخة جديدة عند
# كل إصدار. لذا يُسمح بتخزين طويل: لا يخدم نسخة قديمة لأن العنوان نفسه يتغيّر.
[[headers]]
  for = "/app.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/app.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/config.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/version.json"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # سياسة المحتوى مفروضة الآن (لا إبلاغ فقط). ما تمنعه فعلياً:
    # تحميل أي سكربت خارجي، وحقن base لسرقة المسارات النسبية، وإرسال أي نموذج
    # لجهة خارجية، وأي اتصال شبكي لغير Supabase، وأي صورة أو صوت من مصدر غريب،
    # وobject/embed، وتضمين التطبيق داخل إطار.
    # بعد تفكيك index.html صار script-src 'self' فقط: لا سكربت داخلي ولا خارجي
    # يمكن تنفيذه، وهو الحاجز الفعلي أمام أي حقن نصّي.
    # 'unsafe-inline' يبقى على style-src وحده لأن الواجهة تستخدم ٦١٣ سمة style
    # سطرية؛ حقن الأنماط لا ينفّذ سكربتاً تحت script-src صارم، فالمخاطرة محدودة.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://*.supabase.co; media-src 'self' data: blob: https://*.supabase.co; connect-src 'self' https://*.supabase.co wss://*.supabase.co; worker-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'; frame-ancestors 'none'"
    X-Frame-Options = "DENY"
    # لا نطلب صلاحيات لا نستخدمها؛ الكاميرا والميكروفون والموقع للأصل نفسه فقط
    Permissions-Policy = "geolocation=(self), microphone=(self), camera=(self), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=(), interest-cohort=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    # النسخة الصارمة (بلا unsafe-inline) تبقى في وضع الإبلاغ حتى يُفكَّك الملف،
    # فنرى ما ستكسره قبل فرضها بدل أن نكتشف ذلك على أجهزة الموظفات.
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://*.supabase.co; media-src 'self' data: blob: https://*.supabase.co; connect-src 'self' https://*.supabase.co wss://*.supabase.co; worker-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'; frame-ancestors 'none'"
